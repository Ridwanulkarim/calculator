<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS 18 Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="iphone-frame">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="time">9:41</div>
            <div class="status-icons">
                <svg class="icon-signal" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="2" y="16" width="3" height="5" rx="1"/>
                    <rect x="7" y="12" width="3" height="9" rx="1"/>
                    <rect x="12" y="8" width="3" height="13" rx="1"/>
                    <rect x="17" y="4" width="3" height="17" rx="1"/>
                </svg>
                <svg class="icon-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M12 20h.01"/>
                    <path d="M8.5 16.4a5 5 0 0 1 7 0"/>
                    <path d="M5 12.8a10 10 0 0 1 14 0"/>
                    <path d="M2 9.2a15 15 0 0 1 20 0"/>
                </svg>
                <svg class="icon-battery" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="2" y="6" width="17" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
                    <rect x="4" y="8" width="11" height="8" rx="1.5"/>
                    <path d="M21 10v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
        </div>

        <!-- Top Header Controls -->
        <div class="header-controls">
            <button class="icon-btn" aria-label="History/Menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="8" y1="6" x2="21" y2="6"/>
                    <line x1="8" y1="12" x2="21" y2="12"/>
                    <line x1="8" y1="18" x2="21" y2="18"/>
                    <line x1="3" y1="6" x2="3.01" y2="6" stroke-width="3"/>
                    <line x1="3" y1="12" x2="3.01" y2="12" stroke-width="3"/>
                    <line x1="3" y1="18" x2="3.01" y2="18" stroke-width="3"/>
                </svg>
            </button>
            <button class="icon-btn" aria-label="Mode">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="5" y="3" width="14" height="18" rx="3"/>
                    <rect x="8" y="6" width="8" height="3" rx="1" fill="currentColor"/>
                    <circle cx="8.5" cy="12.5" r="1" fill="currentColor"/>
                    <circle cx="12" cy="12.5" r="1" fill="currentColor"/>
                    <circle cx="15.5" cy="12.5" r="1" fill="currentColor"/>
                    <circle cx="8.5" cy="15.5" r="1" fill="currentColor"/>
                    <circle cx="12" cy="15.5" r="1" fill="currentColor"/>
                    <circle cx="15.5" cy="15.5" r="1" fill="currentColor"/>
                    <circle cx="8.5" cy="18.5" r="1" fill="currentColor"/>
                    <circle cx="12" cy="18.5" r="1" fill="currentColor"/>
                    <circle cx="15.5" cy="18.5" r="1" fill="currentColor"/>
                </svg>
            </button>
        </div>

        <!-- Display Area -->
        <div class="display-area">
            <div class="expression-display" id="expression"></div>
            <div class="main-display" id="display">0</div>
        </div>

        <!-- Keypad Grid -->
        <div class="keypad">
            <!-- Row 1 -->
            <button class="key function" id="backspace-btn" data-action="backspace" aria-label="Backspace">
                <svg class="backspace-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
                    <line x1="18" y1="9" x2="12" y2="15"/>
                    <line x1="12" y1="9" x2="18" y2="15"/>
                </svg>
            </button>
            <button class="key function" id="clear-btn" data-action="clear">AC</button>
            <button class="key function" data-action="percent">%</button>
            <button class="key operator" data-action="operator" data-operator="÷">÷</button>

            <!-- Row 2 -->
            <button class="key number" data-number="7">7</button>
            <button class="key number" data-number="8">8</button>
            <button class="key number" data-number="9">9</button>
            <button class="key operator" data-action="operator" data-operator="×">×</button>

            <!-- Row 3 -->
            <button class="key number" data-number="4">4</button>
            <button class="key number" data-number="5">5</button>
            <button class="key number" data-number="6">6</button>
            <button class="key operator" data-action="operator" data-operator="-">−</button>

            <!-- Row 4 -->
            <button class="key number" data-number="1">1</button>
            <button class="key number" data-number="2">2</button>
            <button class="key number" data-number="3">3</button>
            <button class="key operator" data-action="operator" data-operator="+">+</button>

            <!-- Row 5 -->
            <button class="key function" data-action="toggle-sign">
                <svg class="toggle-sign-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="5" y1="8" x2="13" y2="8"/>
                    <line x1="9" y1="4" x2="9" y2="12"/>
                    <line x1="14" y1="18" x2="20" y2="12"/>
                    <line x1="5" y1="18" x2="13" y2="18"/>
                </svg>
            </button>
            <button class="key number" data-number="0">0</button>
            <button class="key number" data-action="decimal">.</button>
            <button class="key operator" data-action="calculate">=</button>
        </div>

        <!-- Home Indicator -->
        <div class="home-indicator"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
